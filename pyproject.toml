[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti"
version = "1.0.0"
description = "Assistive Edge-AI Wearable for Visually Impaired Spatial Navigation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Drishti Team", email = "sanalsiva2005@gmail.com" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "onnxruntime>=1.16.0",
    "pyyaml>=6.0.0",
    "pytesseract>=0.3.10",
    "sounddevice>=0.4.6",
    "pyserial>=3.5",
    "paho-mqtt>=2.0.0",
    "piper-tts>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
pi = ["VL53L1X>=0.0.5"]
vlm = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.49.0",
    "accelerate>=1.2.0",
    "huggingface-hub>=0.27.0",
    "safetensors>=0.4.5",
    "num2words>=0.5.14",
]
training = ["ultralytics>=8.3.0"]

[tool.setuptools]
include-package-data = true
py-modules = ["pipeline"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "cognitive*",
    "config*",
    "hal*",
    "perception*",
    "safety*",
]
exclude = [
    "evaluation*",
    "firmware*",
    "models*",
    "scripts*",
    "tests*",
]
namespaces = true

[tool.setuptools.package-data]
config = ["*.yaml", "*.service"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
