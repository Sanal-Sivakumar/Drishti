; Drishti ESP32 sensor MCU — PlatformIO project
; Board: ESP32 DevKit V1 (30-pin)
;
;   pio run -t upload
;   pio device monitor -b 921600
;

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
monitor_filters = time
upload_speed = 921600
lib_deps =
    pololu/VL53L0X@^1.3.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
