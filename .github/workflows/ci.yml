name: Drishti Headless CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Headless Verification & Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin tesseract-ocr-tam tesseract-ocr-mal libasound2-dev alsa-utils ffmpeg

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ".[dev]"

      - name: Execute Automated Test Suite
        run: |
          python -m compileall -q cognitive config hal perception safety scripts pipeline.py
          python -m pytest tests/ --cov=cognitive --cov=hal --cov=perception --cov=safety --cov=pipeline --cov-fail-under=60

      - name: Static quality gates
        if: matrix.python-version == '3.12'
        run: |
          ruff check --select E9,F63,F7,F82 .
