camera:
  backend: auto
  device_index: -1
  capture_width: 640
  capture_height: 480
  fps: 30
distance_sensor:
  backend: esp32_serial
  serial_port: auto
  baud: 921600
  stale_ms: 120
  min_valid_mm: 30
  max_valid_mm: 2000
  offset_mm: 0
  fallback_backend: synthetic
trigger_input:
  backend: esp32_buttons
  keyboard_fallback: true
audio_output:
  backend: alsa
  device_name: default
  sample_rate_hz: 44100
  channels: 2
