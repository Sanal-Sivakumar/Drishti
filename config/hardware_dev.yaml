# Hardware Configuration: Linux Workstation / Development Environment
#
# Laptop test stack:
#   - built-in colour webcam
#   - ESP32 DevKit V1 + VL53L0X over USB serial
#   - two push buttons on the ESP32
#   - laptop speakers or Bluetooth A2DP earbuds

camera:
  backend: "auto"              # Options: "synthetic", "opencv", "v4l2", "auto"
  device_index: -1             # -1 = auto-probe 0..4, preferring a colour camera
  capture_width: 640
  capture_height: 480
  fps: 30

distance_sensor:
  backend: "esp32_serial"      # Options: "esp32_serial", "synthetic", "vl53l1x"
  serial_port: "auto"          # "auto", /dev/ttyUSB0, /dev/ttyACM0, /dev/drishti-tof
  baud: 921600
  stale_ms: 120                # samples older than this are discarded
  min_valid_mm: 30
  max_valid_mm: 2000
  offset_mm: 0                 # calibration offset (see scripts/calibrate_tof.py)
  fallback_backend: "synthetic"

trigger_input:
  backend: "esp32_buttons"     # Options: "esp32_buttons", "keyboard", "synthetic", "gpio"
  keyboard_fallback: true      # keep N/C keys working alongside the physical buttons

audio_output:
  backend: "alsa"              # Options: "headless", "alsa", "bluetooth"
  device_name: "default"       # or a pulse/pipewire sink name for Bluetooth
  sample_rate_hz: 44100
  channels: 2
