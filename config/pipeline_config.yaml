# Drishti Pipeline Configuration Schema

pipeline:
  mode: "production"
  target_fps: 30
  frame_width: 640
  frame_height: 480
  headless: true

perception:
  detector:
    model_family: "yolo_nano"
    confidence_threshold: 0.40
    iou_threshold: 0.45
    target_classes:
      - person
      - chair
      - table
      - car
      - bicycle
    model_path: "models/yolov8n.onnx"

  temporal_confirmation:
    required_frames: 2
    max_distance_delta_m: 0.6
  
  tof_fusion:
    calibration_file: "config/geometry_calibration.yaml"
    calibration_verified: true # Verified for current device bench setup
    cone_half_angle_deg: 13.5   # VL53L1X 27 degree full cone
    min_distance_m: 0.05
    max_distance_m: 4.00
    camera_fov_h_deg: 120.0     # Camera Module 3 Wide
    # fx is derived from frame_width and calibrated horizontal FOV.
    principal_point_x: 320.0
    principal_point_y: 240.0
    baseline_x_m: 0.0          # Measure on the assembled device
    baseline_y_m: 0.0
    tof_hit_margin_px: 8.0
    class_priors_m:
      person: 1.70
      chair: 0.85
      dining table: 0.75
      car: 1.50

  spatial_audio:
    sample_rate_hz: 44100
    head_radius_m: 0.0875       # Woodworth spherical head model radius
    speed_of_sound_mps: 343.0
    caution_pitch_hz: 440.0     # Musical note A4
    warning_pitch_hz: 660.0     # Musical note E5
    critical_pitch_hz: 880.0    # Musical note A5
    pulse_min_rate_hz: 1.0      # At 4.0 meters
    pulse_max_rate_hz: 10.0     # At 0.5 meters
    ild_attenuation_db_per_rad: 12.0
    high_component_hz: 3200.0
    high_component_mix: 0.28
    limiter_peak: 0.35
    critical_tof_distance_m: 0.8
    audio_profile: "air_conduction"
    profiles:
      air_conduction:
        calibrated: true
        itd_scale: 1.0
        ild_scale: 1.0
        left_gain: 1.0
        right_gain: 1.0
      bone_conduction:
        calibrated: true
        itd_scale: 0.65
        ild_scale: 0.55
        left_gain: 1.0
        right_gain: 1.0

cognitive:
  online_vision:
    provider: "auto" # "auto" detects OPENAI_API_KEY or GEMINI_API_KEY
    openai_model: "gpt-4o-mini"
    gemini_model: "gemini-2.5-flash"
    timeout_s: 8.0

  tts:
    engine: "piper"
    default_language: "en_US"
    speaking_rate: 0.95
    voice_type: "female1"
    pitch: 0
    sample_rate_hz: 22050
    piper_model: "models/piper/en_US-lessac-medium.onnx"
    piper_length_scale: 1.12
    piper_sentence_silence: 0.25
    async_playback: true

safety:
  privacy:
    enable_face_blur: true
    blur_kernel_size: 15
    blur_sigma: 7.0
  telemetry:
    device_id: "drishti-wearable-01"
    broker_host: "localhost"
    broker_port: 8883
    use_tls: true
    require_auth: true
    ca_certs: null
    qos: 1
    heartbeat_interval_s: 10
    buffer_limit: 500
    persistence_path: "var/telemetry-buffer.jsonl"
    username_env: "DRISHTI_MQTT_USERNAME"
    password_env: "DRISHTI_MQTT_PASSWORD"
