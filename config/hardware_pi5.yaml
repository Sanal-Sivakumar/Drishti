# Hardware Configuration: Target Raspberry Pi 5 Edge Device
# Supports two hardware setups:
# 1. Direct Pi 5 setup: IMX708 camera, direct I2C VL53L1X, and direct GPIO buttons (default below).
# 2. ESP32 Sidecar setup: set distance_sensor.backend: "esp32_serial" and trigger_input.backend: "esp32_buttons".

camera:
  backend: "libcamera"         # Camera Module 3 CSI (IMX708)
  sensor_name: "imx708"
  csi_port: 0
  capture_width: 640
  capture_height: 480
  fps: 30

distance_sensor:
  backend: "vl53l1x"           # Direct I2C VL53L1X on Pi (or set to "esp32_serial" if using ESP32 sidecar)
  i2c_bus: 1
  i2c_address: 0x29
  timing_budget_ms: 33
  distance_mode: "long"        # Options: "short" (up to 1.3m), "long" (up to 4.0m)
  # When using ESP32 USB sidecar:
  # serial_port: "/dev/ttyUSB0" # or "auto"
  # baud: 921600

trigger_input:
  backend: "gpio"              # Direct GPIO on Pi (or "esp32_buttons" if using ESP32 sidecar)
  pin_button_1: 17             # Header Pin 11 (GPIO 17) - Button 1: Scene Narration
  pin_button_2: 27             # Header Pin 13 (GPIO 27) - Button 2: Currency Identification
  pin_button_3: 22             # Header Pin 15 (GPIO 22) - Button 3: Text Reading
  # Aliases for backward compatibility:
  pin_button_narration: 17
  pin_button_currency_ocr: 27
  pull_mode: "up"
  debounce_ms: 50

audio_output:
  backend: "alsa"
  device_name: "default"
  sample_rate_hz: 44100
  channels: 2
  buffer_frames: 1024

